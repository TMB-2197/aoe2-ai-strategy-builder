; name of AI script
ScriptName = "StrategyBuilder"

; version number (empty string for none)
ScriptVersion = "1.0"

; author (empty string for none)
Author = "Unknown"

; author contact (empty string for none)
Contact = ""

; use this to force a particular build-order (empty string for random)
StrategyOverride = ""

; use this to print the selected strategy
DisplayStrategy = "true"

; Warning: some of these paths may require Admin Privledges
; you can fix this by changing the permissions of the folders below to user level

; AI Script folder for CD Version (with UserPatch 1.5)
AIScriptFolderAOC = "C:/Program Files (x86)/Microsoft Games/Age of Empires II/AI"

; AI Script folder for CD Version (with UserPatch 1.5 + Wololo Kingdoms)
AIScriptFolderWK = "C:/Program Files (x86)/Microsoft Games/Age of Empires II/Games/Wololo Kingdoms/Script.Ai"

; AI Script folder for the Definitive Edition
AIScriptFolderDE = "C:/Program Files (x86)/Steam/steamapps/common/AoE2DE/resources/_common/ai"
; AIScriptFolderDE = "C:/Users/<user>/Games/Age of Empires 2 DE/<steam-id>/mods/local/<mod-name>/resources/_common/ai"
