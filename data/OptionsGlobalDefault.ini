; Default options for Immortal AI
; Do not modify these, instead create a 'OptionsGlobal.ini' file with your preferred values
; These are ONLY available as global options, NOT build-order-specific options

; micro on/off

; enable/disable all economy micro
EnableEcoMicro = 1
; enable/disable all soilder micro
EnableSoilderMicro = 1
; enable/disable all defence micro
EnableDefenceMicro = 1
; enable/disable all scout micro
EnableScoutMicro = 1

; functions on/off

; reassign newly created villagers using gather points
EcoReassignment::reassignNewVills = 1
; reassign villagers gathering wrong resources (based on their ctrl group)
EcoReassignment::reassignWrongRes = 1
; reassign villagers walking a long distance when there's a better camp
EcoReassignment::reassignFarWalkers = 1
; reassign villagers walking towards dangerous farms/camps
EcoReassignment::reassignDangerousGatherers = 1
; reassign villagers for eco balance by switching ctrl group; use this along with reassignWrongRes
EcoReassignment::reassignForEcoBalance = 1
; reassign villagers near TC for eco balance (via hop)
EcoReassignment::reassignForEcoBalanceUnderTC = 1
