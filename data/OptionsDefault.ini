; Default options for Immortal AI
; Do not modify these, instead create a 'Options.ini' file with your preferred values
; These can be converted to build-order-specific options by adding them to the 'options' tab

; (killRamUnderTC) attack rams withing this dist (relative to fort)
Defence::KILL_RAM_DIST = 5
; (killRamUnderTC) skip ram attack if too many enemies within this dist
Defence::KILL_RAM_AVOID_ENEMY_DIST = 7
; (killRamUnderTC) find villagers to attack rams within this dist
Defence::KILL_RAM_VILLAGER_DIST = 13
; (killRamUnderTC) number of villagers to attack each ram
Defence::KILL_RAM_VILLAGER_PER_RAM = 5

; (repairTC) hp percent below which we ungarrison to repair TC
Defence::REPAIR_TC_UNGARRISON_PERCENT = 45
; (repairTC) hp percent above which we re-garrison the TC
Defence::REPAIR_TC_REGARRISON_PERCENT = 80
; (repairTC) hp percent below which we abandon the TC
Defence::REPAIR_TC_ABANDON_PERCENT = 13

; (autoGarrison) min villagers to garrison when enemies near TC
Defence::AUTO_GARRISON_MIN_VILLAGERS = 3

; (attackIsolatedSiege) find villagers within this dist to attack isolated siege/monks
Defence::ATTACK_SIEGE_VILLAGER_DIST = 15
; (attackIsolatedSiege) find villagers within this dist to attack high-priority isolated siege/monks
Defence::ATTACK_SIEGE_VILLAGER_DIST_HIGH_PRIORITY = 22
; (attackIsolatedSiege) number of villagers to attack each unit
Defence::ATTACK_SIEGE_VILLAGERS_PER_UNIT = 4
; (attackIsolatedSiege) ignore siege with dangerous units within this dist
Defence::ATTACK_SIEGE_PROTECTED_DIST = 14

; (markThreatenedVills) min nearby enemy units for villager retreat (low eco)
Defence::RETREAT_MIN_ENEMY_UNITS_LOW = 3
; (markThreatenedVills) min nearby enemy units for villager retreat (high eco)
Defence::RETREAT_MIN_ENEMY_UNITS_HIGH = 5
; (markThreatenedVills) max distance to search for nearby enemy units
Defence::RETREAT_MAX_ENEMY_DIST = 16
; (markThreatenedVills) extra dist added to enemy units moving away from villager
Defence::RETREAT_MOVE_AWAY_PENALTY = 10
; (markThreatenedVills) cancel retreat if enemy moves beyond dist limit by this amount
Defence::RETREAT_CANCEL_DIST_THRESHOLD = 6
; (markThreatenedVills) retreat when there are less than this many seconds remaining to reach the TC before the enemy
Defence::RETREAT_SECONDS_IN_ADVANCE = 18
; (markThreatenedVills) cancel retreat when there are more than this many seconds remaining to reach the TC before the enemy
Defence::RETREAT_CANCEL_SECONDS_IN_ADVANCE = 34

; (enforceVillGarrison) skip smart runaway if within this dist of tc
Defence::RETREAT_SKIP_SMART_RUNAWAY_DIST = 9
; (enforceVillGarrison) min dist to consider enemy average pos for smart runaway
Defence::RETREAT_SMART_RUNAWAY_MIN_ENEMY_SEARCH_DIST = 5
; (enforceVillGarrison) smart runaway go towards TC factor
Defence::RETREAT_SMART_RUNAWAY_LERP_TC = 12
; (enforceVillGarrison) smart runaway go away from enemy factor
Defence::RETREAT_SMART_RUNAWAY_LERP_ENEMY = 24

; (repairSiege) number of seige units that can be repaired simultaneously
Defence::MAX_SEIGE_REPAIRS = 4
; (repairSiege) max repairers per siege unit
Defence::MAX_SEIGE_REPAIRERS = 2
; (repairSiege) radius to find potential repairers
Defence::MAX_SEIGE_REPAIRER_DIST = 16

; (ungarrisonSafeTc) max allowed enemies near TC for full ungarrison
Defence::TC_FULL_MAX_ENEMIES = 3
; (ungarrisonSafeTc) min dist to find enemies for full TC ungarrison
Defence::TC_FULL_SAFE_DIST_MIN = 9
; (ungarrisonSafeTc) max dist to find enemies for full TC ungarrison
Defence::TC_FULL_SAFE_DIST_MAX = 17
; (ungarrisonSafeTc) check for enemies within this radius
Defence::TC_SAFE_ENEMY_DIST = 17
; (ungarrisonSafeTc) block ungarrison if enemies within this radius
Defence::TC_CRITICAL_ENEMY_DIST = 5
; (ungarrisonSafeTc) find resource withing this dist for ungarrison
Defence::TC_RESOURCE_DIST = 16
; (ungarrisonSafeTc) offset from enemies to find resources
Defence::TC_RESOURCE_OFF = -15
; (ungarrisonSafeTc) dist from enemies to ignore resources (enemy range also added to this)
Defence::TC_RESOURCE_AVOID_ENEMY = 6
; (ungarrisonSafeTc) find camps withing this dist for ungarrison
Defence::TC_CAMP_DIST = 28
